<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>小飯糰吹奏部 - 個性適配問卷</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=31">
    <script>
        // 非同步載入字體，絕不卡住畫面
        Promise.all([
            new FontFace('Kurewa', 'url(KurewaGothicCjkTc-Bold.ttf)').load(),
            new FontFace('OpenHuninn', 'url(粉圓體.ttf)').load()
        ]).then(function(loadedFonts) {
            loadedFonts.forEach(function(font) {
                document.fonts.add(font);
            });
        }).catch(function(error) {
            console.log('字體載入失敗，將使用系統預設字體', error);
        });
    </script>
</head>
<body>
    <div id="initial-loader" style="position:fixed; top:0; left:0; width:100vw; height:100vh; background:#f4f7f6; z-index:99999; display:flex; flex-direction:column; justify-content:center; align-items:center;">
        <div style="width: 50px; height: 50px; border: 5px solid #ccc; border-top-color: #2A4B7C; border-radius: 50%; animation: spin 1s linear infinite;"></div>
        <div style="margin-top: 15px; font-family: sans-serif; color: #2A4B7C; font-weight: bold;">載入中，請稍候...</div>
        <style>@keyframes spin { 100% { transform: rotate(360deg); } }</style>
    </div>
    <div id="app"></div>

    <!-- BGM Audio -->
    <audio id="bgm" src="bgm.m4a" loop></audio>
    <div id="bgm-toggle" class="bgm-toggle" onclick="toggleBgm()">
        <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 18V5l12-2v13"></path>
            <circle cx="6" cy="18" r="3"></circle>
            <circle cx="18" cy="16" r="3"></circle>
        </svg>
        <svg id="bgm-slash" viewBox="0 0 24 24" width="24" height="24" stroke="red" stroke-width="2" stroke-linecap="round" style="position:absolute;">
            <line x1="3" y1="3" x2="21" y2="21"></line>
        </svg>
    </div>
    
    <!-- Load html2canvas for image export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <!-- SortableJS for Drag and Drop -->
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
    
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-database-compat.js"></script>

    <script src="app.js?v=32"></script>
</body>
</html>
